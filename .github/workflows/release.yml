name: Release

# Tag-driven publish to nuget.org. The file name is fixed: the nuget.org trusted-publishing policy pins it.
# Nothing publishes on a push to a branch or on a pull request. A release tag needs a manual approval.
#
# Security properties (do not weaken):
#   * The tag is validated against a strict pattern BEFORE it is used anywhere, resolved only as refs/tags/<tag>,
#     and the commit it points at is what gets built (never a branch of the same name).
#   * Inputs and context values reach shell steps only through env:, never interpolated into run:.
#   * The release is not authorised by github.actor alone: a re-run keeps the original actor, so the
#     triggering actor must equal the actor and run_attempt must be 1. A re-run needs a fresh dispatch.
#   * Publishing fails closed: it requires the repository variable STABLE_PUBLISH_MODE=environment, which attests
#     that the protected `nuget-stable` environment (required reviewers) is configured. Unset or any other value
#     refuses to publish.
#   * This workflow builds and tests the tagged commit itself; it never trusts or reuses an earlier CI run.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build, for example v10.0.0'
        required: true
        type: string
      dry-run:
        description: 'Run guard, build, test and pack only; publish nothing'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.verify.outputs.version }}
      dry_run: ${{ steps.authorize.outputs.dry_run }}
    steps:
      - name: Authorize the run
        id: authorize
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_DRY_RUN: ${{ inputs.dry-run }}
          PUBLISH_MODE: ${{ vars.STABLE_PUBLISH_MODE }}
        run: |
          set -euo pipefail
          if [ "$ACTOR" != "$TRIGGERING_ACTOR" ]; then echo "::error::triggering actor differs from actor (re-run by another user)"; exit 1; fi
          if [ "$RUN_ATTEMPT" != "1" ]; then echo "::error::re-runs are refused; dispatch a new run"; exit 1; fi
          dry=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DISPATCH_DRY_RUN" = "true" ]; then dry=true; fi
          if [ "$dry" != "true" ] && [ "$PUBLISH_MODE" != "environment" ]; then
            echo "::error::STABLE_PUBLISH_MODE is not 'environment'; refusing to publish (fail closed)"; exit 1
          fi
          echo "dry_run=$dry" >> "$GITHUB_OUTPUT"

      - name: Validate the tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then tag="$DISPATCH_TAG"; else
            if [ "$REF_TYPE" != "tag" ]; then echo "::error::not a tag ref"; exit 1; fi
            tag="$REF_NAME"
          fi
          re='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ "$tag" == *$'\n'* ]] || ! [[ "$tag" =~ $re ]]; then
            echo "::error::only stable vMAJOR.MINOR.PATCH tags are released (no pre-release suffix, no build metadata)"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout the tag explicitly
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the tagged commit
        id: resolve
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          head="$(git rev-parse HEAD)"
          if [ "$sha" != "$head" ]; then echo "::error::checked-out commit is not the tag's commit"; exit 1; fi
          if [ "$EVENT_NAME" = "push" ] && [ "$sha" != "$EVENT_SHA" ]; then echo "::error::tag commit differs from the pushed commit"; exit 1; fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::not a commit hash"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Verify tag, framework, branch, version and Core dependency
        id: verify
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          # Tag format, target framework, releases/vM.m.x branch and the declared <Version> (which must equal the tag version) are
          # checked by a script, not by pipelines: `x | grep -q` under pipefail fails at random with SIGPIPE.
          branches="$(git branch -r --contains "$SHA" | sed 's/^[* ]*//')"
          python3 scripts/release_verify.py tag "$TAG" --branches "$branches" >> "$GITHUB_OUTPUT"

          if [ -n "${TabTabGoCoreVersion:-}" ]; then echo "::error::TabTabGoCoreVersion must not be set in a release run"; exit 1; fi
          core_range="$(grep -m1 -oE '<TabTabGoCoreVersion[^>]*>[^<]+' Directory.Packages.props | sed 's/.*>//')"
          [ -n "$core_range" ] || { echo "::error::no default Core version range found in Directory.Packages.props"; exit 1; }
          if [[ "$core_range" == *local* ]]; then
            echo "::error::a -local Core version is the default; local feeds must not be released"; exit 1
          fi
          # Every PackageVersion line for TabTabGo.* must use the property (no hard-coded floating pin).
          # shellcheck disable=SC2016  # the single-quoted $(...) is the literal MSBuild property text, not a shell expansion
          hardcoded="$(grep -E 'PackageVersion Include="TabTabGo\.' Directory.Packages.props | grep -v 'Version="\$(TabTabGoCoreVersion)"' || true)"
          if [ -n "$hardcoded" ]; then
            echo "::error::TabTabGo.* packages must take their version from TabTabGoCoreVersion"; exit 1
          fi
          # Every release is stable (release_verify.py already refused any pre-release tag): so is the Core it depends on.
          if [[ "$core_range" =~ [0-9]+\.[0-9]+\.[0-9]+- ]]; then
            echo "::error::a release must not depend on a pre-release TabTabGo.Core"; exit 1
          fi

  build-test-pack:
    name: build-test-pack
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      # Packable projects. Add TabTabGo.Storage.Api here when the minimal-API package ships (step A10).
      EXPECTED_PACKAGES: 'TabTabGo.Storage TabTabGo.Storage.Services TabTabGo.Storage.Data.EF TabTabGo.Storage.Aws TabTabGo.Storage.Azure TabTabGo.Storage.FileStorage'
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
    steps:
      - name: Checkout the validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET (SDK from global.json)
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore TabTabGo.Storage.sln

      - name: Build (warnings are errors)
        run: dotnet build TabTabGo.Storage.sln -c Release -warnaserror --no-restore

      - name: Assembly API compatibility (scripts/apicompat.py) against the 8.0.0 libraries; the package-validation baseline in src/Directory.Build.props stays 6.0.8.4 - (v10 is additive-only)
        run: |
          dotnet tool restore
          python3 scripts/apicompat.py

      - name: Test (emulator tests included; Docker is available on this runner)
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'   # ephemeral runner; a failed Ryuk start would hang the emulator tests
        run: dotnet test --solution TabTabGo.Storage.sln -c Release --no-build --coverlet --coverlet-output-format cobertura --results-directory coverage

      - name: Coverage gate
        run: python3 scripts/coverage-gate.py coverage

      - name: Vulnerable and deprecated packages
        run: |
          set -euo pipefail
          dotnet list TabTabGo.Storage.sln package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          dotnet list TabTabGo.Storage.sln package --deprecated 2>&1 | tee deprecated.txt
          # `dotnet list` exits 0 even when it cannot read the audit data; the script fails closed on that too.
          python3 scripts/release_verify.py audit --kind vulnerable --file vulnerable.txt
          python3 scripts/release_verify.py audit --kind deprecated --file deprecated.txt

      - name: Secret scan (checksum-verified gitleaks)
        run: |
          set -euo pipefail
          curl -fsSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks dir . --no-banner --redact --exit-code 1

      - name: Pack
        run: dotnet pack TabTabGo.Storage.sln -c Release --no-build -p:Version="$VERSION" -p:ContinuousIntegrationBuild=true -o out

      - name: Verify the package set
        run: python3 scripts/release_verify.py packages --dir out --expected "$EXPECTED_PACKAGES" --version "$VERSION"

      - name: Verify the RESOLVED Core dependency of every package
        run: |
          set -euo pipefail
          # The default range as written in Directory.Packages.props; what was actually packed must be exactly that,
          # so a value injected through Directory.Build.props, a .rsp file or the environment cannot slip through.
          core_range="$(grep -m1 -oE '<TabTabGoCoreVersion[^>]*>[^<]+' Directory.Packages.props | sed 's/.*>//')"
          if ! [[ "$core_range" =~ ^\[[0-9]+\.[0-9]+\.[0-9]+,\ [0-9]+\.[0-9]+\.[0-9]+\)$ ]]; then
            echo "::error::a release needs a stable bounded Core range, found '$core_range'"; exit 1
          fi
          found=0
          for file in out/*.nupkg; do
            nuspec="$(unzip -p "$file" '*.nuspec')"
            while IFS= read -r version; do
              [ -n "$version" ] || continue
              found=$((found + 1))
              if [ "$version" != "$core_range" ]; then
                echo "::error::$file depends on a Core package at '$version', expected exactly '$core_range'"; exit 1
              fi
            done < <(printf '%s' "$nuspec" | grep -oE '<dependency id="(TabTabGo\.Core[A-Za-z.]*|TabTabGo\.Data\.EF)" version="[^"]+"' | sed -E 's/.*version="([^"]+)"/\1/')
          done
          [ "$found" -gt 0 ] || { echo "::error::no Core dependency found in any package"; exit 1; }

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: out
          if-no-files-found: error

  publish:
    name: publish
    needs: [guard, build-test-pack]
    if: needs.guard.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Every release is stable and waits for a required reviewer in the nuget-stable environment.
    environment: nuget-stable
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Re-check the authorization context
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          PUBLISH_MODE: ${{ vars.STABLE_PUBLISH_MODE }}
        run: |
          set -euo pipefail
          [ "$ACTOR" = "$TRIGGERING_ACTOR" ] && [ "$RUN_ATTEMPT" = "1" ] && [ "$PUBLISH_MODE" = "environment" ]

      # The scripts come from the exact commit the guard resolved (not from the tag name, which could move during the approval wait).
      - name: Checkout the tagged commit (scripts only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.sha }}
          sparse-checkout: scripts
          persist-credentials: false

      # Outside the workspace: actions/checkout empties the workspace on a fresh runner, so a download into it would be wiped.
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/out

      - name: Refuse a version that is already on nuget.org (the push below has no --skip-duplicate, so this check is the guard)
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: python3 scripts/release_verify.py not-published --dir "$RUNNER_TEMP/out" --version "$VERSION"

      - name: Require the trusted-publishing user
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          set -euo pipefail
          [ -n "$NUGET_USER" ] || { echo "::error::configure the repository variable NUGET_USER (nuget.org trusted publishing); there is no API-key fallback"; exit 1; }

      - name: NuGet trusted publishing login (short-lived key)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org (trusted publishing)
        env:
          NUGET_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "$RUNNER_TEMP/out/*.nupkg" --api-key "$NUGET_KEY" --source https://api.nuget.org/v3/index.json

  github-release:
    name: github-release
    needs: [guard, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Outside the workspace: actions/checkout empties the workspace on a fresh runner, so a download into it would be wiped.
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/out

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.guard.outputs.tag }}
          SHA: ${{ needs.guard.outputs.sha }}
        run: |
          set -euo pipefail
          # A tag can be moved after the approval: resolve it again through the API (following annotated tags until a commit) and compare.
          type="$(gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" --jq .object.type)"
          resolved="$(gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" --jq .object.sha)"
          [ -n "$type" ] && [ -n "$resolved" ] || { echo "::error::could not resolve tag ${TAG}"; exit 1; }
          while [ "$type" = "tag" ]; do
            next_type="$(gh api "repos/${GH_REPO}/git/tags/${resolved}" --jq .object.type)"
            next_sha="$(gh api "repos/${GH_REPO}/git/tags/${resolved}" --jq .object.sha)"
            [ -n "$next_type" ] && [ -n "$next_sha" ] || { echo "::error::could not dereference annotated tag ${TAG}"; exit 1; }
            type="$next_type"
            resolved="$next_sha"
          done
          if [ "$resolved" != "$SHA" ]; then
            echo "::error::tag ${TAG} now points at ${resolved}, not at the published commit ${SHA}; no release is created"; exit 1
          fi
          gh release create "$TAG" "$RUNNER_TEMP"/out/*.nupkg --verify-tag --generate-notes
